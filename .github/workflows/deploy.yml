name: Build, Test, and Deploy

on:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest   # GitHub-hosted is fine here — no VM access needed
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt

      # There is currently NO runnable automated test suite. The files under
      # backend/gamification/ (test_api.py, test_admin.py, …) import a
      # `PracticeQuestion` model that was deleted in Feb 2026 when practice
      # questions moved to assignments.Question + PracticeQuestionLibrary, so
      # all 21 of them error on import. The other backend/test_*.py files are
      # ad hoc debug scripts needing a live, hand-seeded DB.
      #
      # Until real coverage exists, run Django's system check: it still catches
      # broken imports, bad settings and model misconfiguration without needing
      # a database.
      - name: Django system check
        working-directory: backend
        env:
          SECRET_KEY: ci-only-not-secret
          DEBUG: "False"
        run: python manage.py check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # Non-blocking: the frontend currently has ~100 pre-existing lint errors
      # (mostly unused vars/imports). Reported for visibility so they can be
      # cleaned up incrementally, but not a deploy gate. Flip this to blocking
      # once the backlog is cleared.
      - name: Lint frontend
        working-directory: frontend
        continue-on-error: true
        run: npm run lint

      - name: Build frontend (compile check)
        working-directory: frontend
        run: npm run build

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/zvikrnt/autograder-backend:${{ steps.meta.outputs.tag }}
            ghcr.io/zvikrnt/autograder-backend:latest
          # Falls back to 999 (the usual docker group GID) when the repo
          # variable isn't set — an empty value would make `groupadd -g ""`
          # fail the build. Set HOST_DOCKER_GID in repo variables to the VM's
          # real `getent group docker` GID.
          build-args: |
            DOCKER_GID=${{ vars.HOST_DOCKER_GID || '999' }}

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/zvikrnt/autograder-frontend:${{ steps.meta.outputs.tag }}
            ghcr.io/zvikrnt/autograder-frontend:latest

  deploy:
    needs: build-and-push
    # Self-hosted runner installed directly on the target VM. Chosen over an
    # SSH-from-hosted-runner approach because a college-cluster VM behind a
    # campus firewall is very unlikely to accept inbound connections from
    # GitHub's (wide, changing) hosted-runner IP ranges. A self-hosted
    # runner makes an outbound-only long-poll connection to GitHub instead,
    # so no inbound firewall change is needed, and this job runs directly
    # against the local Docker daemon with no SSH hop.
    #
    # Trade-off: this workflow executes with the runner's permissions
    # directly on the production VM. Treat .github/workflows/*.yml with the
    # same review rigor as production code (require PR review to merge to
    # main, avoid untrusted third-party Actions).
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Pull new images and deploy
        run: |
          echo "IMAGE_TAG=${{ needs.build-and-push.outputs.tag }}" > .env.deploy
          docker compose -f docker-compose.prod.yml --env-file backend/.env --env-file .env.deploy pull
          docker compose -f docker-compose.prod.yml --env-file backend/.env --env-file .env.deploy \
            up -d --scale backend=3 --remove-orphans

      - name: Run migrations
        run: docker compose -f docker-compose.prod.yml exec -T backend python manage.py migrate --noinput

      - name: Record deployed tag for rollback
        run: |
          mkdir -p /opt/autograder/deployed_tags
          echo "${{ needs.build-and-push.outputs.tag }}" > "/opt/autograder/deployed_tags/$(date +%Y%m%d-%H%M%S).txt"

      - name: Smoke test
        run: curl -sf https://autograder.iitbh/api/health/ || (echo "Smoke test failed" && exit 1)
