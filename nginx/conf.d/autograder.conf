map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name autograder.iitbh;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name autograder.iitbh;

    # College-supplied cert/key, mounted read-only from /etc/autograder/tls
    # on the host (see docker-compose.prod.yml).
    ssl_certificate     /etc/nginx/tls/autograder.iitbh.crt;
    ssl_certificate_key /etc/nginx/tls/autograder.iitbh.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 25m;   # submission file uploads

    # --- WebSocket traffic (Django Channels / gamification live features) ---
    location /ws/ {
        proxy_pass http://daphne_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Default 60s proxy timeout would silently kill idle-but-open
        # WebSocket connections (e.g. the live leaderboard).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- REST API ---
    location /api/ {
        proxy_pass http://daphne_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";   # enable keepalive to upstream
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 130s;
    }

    # --- Django admin (raw model editing; separate from the React /admin
    #     portal below, which is served by the SPA at "/") ---
    location /django-admin/ {
        proxy_pass http://daphne_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /media/ {
        proxy_pass http://daphne_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /static/ {
        proxy_pass http://daphne_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        expires 30d;
    }

    # --- SPA (React build, served by the frontend container's own nginx) ---
    location / {
        proxy_pass http://frontend_static;
        proxy_set_header Host $host;
    }
}
