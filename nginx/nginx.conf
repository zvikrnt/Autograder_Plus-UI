user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Docker Compose's embedded DNS resolves "backend" to all replica IPs
    # when the service is started with `--scale backend=N`; nginx
    # round-robins/least-conns across them.
    upstream daphne_backend {
        least_conn;
        server backend:8000 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    upstream frontend_static {
        server frontend:80;
    }

    include /etc/nginx/conf.d/*.conf;
}
